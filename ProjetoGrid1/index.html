<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Galeria de Jogos</title>
</head>

<body>

    <header>
        <h1>Meus Jogos</h1>
    </header>

    <main class="galeria">

        <div class="card">
            <img src="/Testes/img/cs2.png" alt="Counter-Strike 2">
            <h2>CS2</h2>
            <p>FPS competitivo da Valve.</p>
            <button>Ver jogo</button>
        </div>

        <div class="card">
            <img src="/Testes/img/roblox.png" alt="Roblox">
            <h2>Roblox</h2>
            <p>Plataforma com milhares de jogos.</p>
            <button>Ver jogo</button>
        </div>

        <div class="card">
            <img src="/Testes/img/minecraft.png" alt="Minecraft">
            <h2>Minecraft</h2>
            <p>Construa e explore seu próprio mundo.</p>
            <button>Ver jogo</button>
        </div>

        <div class="card">
            <img src="/Testes/img/gta.png" alt="GTA V">
            <h2>GTA V</h2>
            <p>Explore Los Santos em mundo aberto.</p>
            <button>Ver jogo</button>
        </div>

        <div class="card">
            <img src="/Testes/img/valorant.png" alt="Valorant">
            <h2>Valorant</h2>
            <p>FPS tático competitivo.</p>
            <button>Ver jogo</button>
        </div>

        <div class="card">
            <img src="/Testes/img/stardewvalley.png" alt="Stardew Valley">
            <h2>Stardew Valley</h2>
            <p>Cuide da fazenda e explore o vale.</p>
            <button>Ver jogo</button>
        </div>

    </main>

</body>
</html>
